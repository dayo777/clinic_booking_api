name: doctor-service-test
on:
  push:
    branches: [dev, feature/*]
    paths:
      - 'doctor_service/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-doctor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doctor_service/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-doctor.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-doctor-service:
    name: Test doctor-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workdir: "."

      - name: Pre-pull test images
        run: |
          docker pull mongo:8.3-rc-noble
          docker pull jaegertracing/jaeger:2.14.1

      - name: Run Tests for doctor_service
        run: cargo test -p doctor_service
