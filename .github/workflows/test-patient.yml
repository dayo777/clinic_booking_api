name: patient-service-test
on:
  push:
    branches: [dev, feature/*]
    paths:
      - 'patient_service/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-patient.yml'
  pull_request:
    branches: [main]
    paths:
      - 'patient_service/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-patient.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-patient-service:
    name: Test patient-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workdir: "."

      - name: Cache Docker images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: ${{ runner.os }}-docker-${{ hashFiles('.github/workflows/test-patient.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Load cached Docker images
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-images/mongo.tar || true
          docker load -i /tmp/docker-images/jaeger.tar || true

      - name: Pre-pull test images
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-images
          docker pull mongo:8.3-rc-noble
          docker pull jaegertracing/jaeger:2.14.1
          docker save -o /tmp/docker-images/mongo.tar mongo:8.3-rc-noble
          docker save -o /tmp/docker-images/jaeger.tar jaegertracing/jaeger:2.14.1

      - name: Run Tests for patient_service
        run: cargo test -p patient_service -- --test-threads=1
