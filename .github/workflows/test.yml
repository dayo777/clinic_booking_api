name: test.yml
on:
  push:
    branches: [dev, feature/*]
  pull_request:
    branches: [dev, feature/*, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - patient_service
          - appointment_service
          - clinic_core
          - clinic_service
          - doctor_service
          - common
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workdir: "."

      - name: Pre-pull test images
        if: matrix.workspace == 'patient_service'
        run: |
          docker pull mongo:7.0
          docker pull jaegertracing/jaeger:2.3.0

      - name: Run Tests for ${{ matrix.workspace }}
        run: cargo test -p ${{ matrix.workspace }}
